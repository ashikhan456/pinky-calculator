<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lobster&family=Noto+Nastaliq+Urdu:wght@400..700&family=Satisfy&family=Space+Grotesk:wght@300..700&display=swap');
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: pink;
    font-family: Arial, sans-serif;
}

.calculator{
   width:320px;
   padding: 20px;
   margin: 100px auto;
   border-radius: 15px;
   background-color: rgb(243, 216, 216);
   border: 2px solid black;
}

#display{
    width:100%;
    height: 60px;
    margin-bottom: 20px;
    font-size:20px;
     text-align: right;
     padding: 10px;
    border: none;
    border-radius: 8px;
      background: linear-gradient(to right, rgb(228, 243, 243), rgb(151, 218, 218));
border: 2px solid rgb(8, 8, 8);
border-style: groove;
    }


.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 55px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    background-color: #f7d5e1;
    color: #470212;
    cursor: pointer;
    border: 2px solid pink;
    border-style: groove;
}
button:hover {
    background-color: #815058;
    color: white;
}
.calculator h2 {
    font-size: 18px;
    padding: 3px;
    margin: 6px;
    margin-top: -5px;
    text-align: center;
    font-family: "Lobster", sans-serif;
    font-weight: 400;
    color: #faeff5b3;

    -webkit-text-stroke: 1px rgb(38, 5, 48);

    text-shadow: 1px 1px 2px #470212;
}

/* Mobile View */

@media screen and (max-width: 600px) {

    body {
        padding: 20px;
    }

    .calculator {
        width: 100%;
        max-width: 320px;
        margin: 50px auto;
        padding: 15px;
        border-radius: 12px;
    }

    .calculator h2 {
        font-size: 20px;
        margin-bottom: 15px;
    }

    #display {
        height: 55px;
        font-size: 22px;
    }

    .buttons {
        gap: 8px;
    }

    button {
        height: 55px;
        font-size: 20px;
    }
}

/* Small Mobile Screens */

@media screen and (max-width: 350px) {

    .calculator {
        padding: 10px;
    }

    button {
        height: 48px;
        font-size: 17px;
    }

    #display {
        height: 50px;
        font-size: 18px;
    }

}
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Simple calculator</h2>

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button>C</button>
            <button>÷</button>
            <button>×</button>
            <button>⌫</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>=</button>

            <button>0</button>
            <button>.</button>

        </div>

    </div>

   <script>


let display = document.getElementById("display");

let buttons = document.querySelectorAll(".buttons button");

let expression = "";

buttons.forEach(function(button) {

    button.addEventListener("click", function() {

        let value = button.innerText;

        // Clear button
        if (value === "C") {
            expression = "";
            display.value = "";
        }

        // Backspace button
        else if (value === "⌫") {
            expression = expression.slice(0, -1);
            display.value = expression;
        }

        // Equal button
        else if (value === "=") {
            try {
                let result = expression
                    .replace(/×/g, "*")
                    .replace(/÷/g, "/");

                display.value = Function('"use strict"; return (' + result + ')')();

                expression = display.value;

            } catch {
                display.value = "Error";
                expression = "";
            }
        }

        // Other buttons
        else {
            expression += value;
            display.value = expression;
        }

    });

});



   </script>

</body>
</html>
